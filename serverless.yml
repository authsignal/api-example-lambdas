service: api-example

provider:
  name: aws
  runtime: nodejs20.x
  environment:
    AUTHSIGNAL_SECRET: ${env:AUTHSIGNAL_SECRET}
    AUTHSIGNAL_URL: ${env:AUTHSIGNAL_URL}
    AUTHSIGNAL_TENANT: ${env:AUTHSIGNAL_TENANT}
    AUTHSIGNAL_CLIENT: ${env:AUTHSIGNAL_CLIENT}
  httpApi:
    authorizers:
      jwtAuthorizer:
        type: jwt
        identitySource: $request.header.authorization
        issuerUrl: ${env:AUTHSIGNAL_URL}/client/public/${env:AUTHSIGNAL_TENANT}
        audience:
          - ${env:AUTHSIGNAL_CLIENT}

package:
  individually: true

functions:
  sendOtp:
    handler: api/send-otp.handler
    events:
      - httpApi:
          method: post
          path: /otp

  signInWithOtp:
    handler: api/sign-in-with-otp.handler
    events:
      - httpApi:
          method: post
          path: /sign-in/otp

  signInWithToken:
    handler: api/sign-in-with-token.handler
    events:
      - httpApi:
          method: post
          path: /sign-in/token

  signOut:
    handler: api/sign-out.handler
    events:
      - httpApi:
          method: post
          path: /sign-out

  refreshSession:
    handler: api/refresh-session.handler
    events:
      - httpApi:
          method: post
          path: /sign-in/refresh

  initPasskeyRegistration:
    handler: api/init-passkey-registration.handler
    events:
      - httpApi:
          method: post
          path: /register/passkey
          authorizer:
            name: jwtAuthorizer

  initPushRegistration:
    handler: api/init-push-registration.handler
    events:
      - httpApi:
          method: post
          path: /register/push
          authorizer:
            name: jwtAuthorizer

  initInAppRegistration:
    handler: api/init-in-app-registration.handler
    events:
      - httpApi:
          method: post
          path: /register/in-app
          authorizer:
            name: jwtAuthorizer

  initWhatsAppRegistration:
    handler: api/init-whatsapp-registration.handler
    events:
      - httpApi:
          method: post
          path: /register/whatsapp
          authorizer:
            name: jwtAuthorizer

  finishWhatsAppRegistration:
    handler: api/finish-whatsapp-registration.handler
    events:
      - httpApi:
          method: post
          path: /register/whatsapp/verify
          authorizer:
            name: jwtAuthorizer

  userProfile:
    handler: api/user-profile.handler
    events:
      - httpApi:
          method: get
          path: /profile
          authorizer:
            name: jwtAuthorizer

  testPush:
    handler: api/test-push.handler
    events:
      - httpApi:
          method: get
          path: /push

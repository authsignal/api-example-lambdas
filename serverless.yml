service: api-example

provider:
  name: aws
  runtime: nodejs20.x
  environment:
    AUTHSIGNAL_SECRET: ${env:AUTHSIGNAL_SECRET}
    AUTHSIGNAL_URL: ${env:AUTHSIGNAL_URL}
    AUTHSIGNAL_TENANT: ${env:AUTHSIGNAL_TENANT}
    AUTHSIGNAL_CLIENT: ${env:AUTHSIGNAL_CLIENT}
  httpApi:
    authorizers:
      jwtAuthorizer:
        type: jwt
        identitySource: $request.header.authorization
        issuerUrl: ${env:AUTHSIGNAL_URL}/v1/client/public/${env:AUTHSIGNAL_TENANT}
        audience:
          - ${env:AUTHSIGNAL_CLIENT}

package:
  individually: true

functions:
  initFlow:
    handler: api/sign-in/init-flow.handler
    events:
      - httpApi:
          method: post
          path: /sign-in

  verifyFlow:
    handler: api/sign-in/verify-flow.handler
    events:
      - httpApi:
          method: post
          path: /sign-in/verify

  sendEmail:
    handler: api/sign-in/send-email.handler
    events:
      - httpApi:
          method: post
          path: /sign-in/email

  verifyEmail:
    handler: api/sign-in/verify-email.handler
    events:
      - httpApi:
          method: post
          path: /sign-in/email/verify

  sendSms:
    handler: api/sign-in/send-sms.handler
    events:
      - httpApi:
          method: post
          path: /sign-in/sms

  verifySms:
    handler: api/sign-in/verify-sms.handler
    events:
      - httpApi:
          method: post
          path: /sign-in/sms/verify

  signOut:
    handler: api/sign-out.handler
    events:
      - httpApi:
          method: post
          path: /sign-out

  refreshSession:
    handler: api/refresh-session.handler
    events:
      - httpApi:
          method: post
          path: /sign-in/refresh

  initPasskeyRegistration:
    handler: api/registration/init-passkey-registration.handler
    events:
      - httpApi:
          method: post
          path: /register/passkey
          authorizer:
            name: jwtAuthorizer

  initPushRegistration:
    handler: api/registration/init-push-registration.handler
    events:
      - httpApi:
          method: post
          path: /register/push
          authorizer:
            name: jwtAuthorizer

  initInAppRegistration:
    handler: api/registration/init-in-app-registration.handler
    events:
      - httpApi:
          method: post
          path: /register/in-app
          authorizer:
            name: jwtAuthorizer

  initSmsRegistration:
    handler: api/registration/init-sms-registration.handler
    events:
      - httpApi:
          method: post
          path: /register/sms
          authorizer:
            name: jwtAuthorizer

  verifySmsRegistration:
    handler: api/registration/verify-sms-registration.handler
    events:
      - httpApi:
          method: post
          path: /register/sms/verify
          authorizer:
            name: jwtAuthorizer

  userProfile:
    handler: api/user-profile.handler
    events:
      - httpApi:
          method: get
          path: /profile
          authorizer:
            name: jwtAuthorizer

  testPush:
    handler: api/test-push.handler
    events:
      - httpApi:
          method: get
          path: /push
